# A fallback for the software factory's Eve, which pushes its work to board/<board thread> and opens
# the branch's pull request itself with gh. If a push still has no open PR two minutes later, this
# opens one as github-actions[bot], titled and described by the branch's first commit. Checking
# right away raced Eve's own gh pr create, and both opened one (#371 and #372 for board/3121).
name: pi-pr

on:
  push:
    branches: ["board/**"]

# One run per branch at a time: two pushes in a row shouldn't both see no PR and both open one.
concurrency:
  group: pi-pr-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open the branch's pull request if it has none
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          sleep 120
          open=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[].url')
          if [ -n "$open" ]; then echo "already open: $open"; exit 0; fi
          gh pr create --head "$BRANCH" --base main --fill-first
